plugins {
    id 'java'
    id 'application'
}

group = 'de.swfdtf.demo'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def lwjglVersion = '3.3.6'
def osName = System.getProperty('os.name').toLowerCase()
def osArch = System.getProperty('os.arch').toLowerCase()
def isMac = osName.contains('mac') || osName.contains('darwin')
def isArm64 = osArch.contains('aarch64') || osArch.contains('arm64')

def lwjglNatives
if (osName.contains('win')) {
    lwjglNatives = isArm64 ? 'natives-windows-arm64' : 'natives-windows'
} else if (isMac) {
    lwjglNatives = isArm64 ? 'natives-macos-arm64' : 'natives-macos'
} else {
    lwjglNatives = isArm64 ? 'natives-linux-arm64' : 'natives-linux'
}

repositories {
    mavenCentral()
}

dependencies {
    // vJava-Engine (KAGAYAKI) über Composite Build
    implementation 'de.swfdtf:KAGAYAKI:1.0.0'

    // Transitive / direkte Laufzeit-Abhängigkeiten passend zum Hauptprojekt
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-stb'

    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"

    implementation 'org.joml:joml:1.10.8'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'de.swfdtf.demo.Main'
    if (isMac) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('runDemoAuto', JavaExec) {
    group = 'demo'
    description = 'Führt das Schneewittchen-vJava-Demo vollständig automatisch in der Konsole aus.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.swfdtf.demo.Main'
    args '--auto', '--project', file('project').absolutePath
}

tasks.register('runDemoInteractive', JavaExec) {
    group = 'demo'
    description = 'Startet das Schneewittchen-vJava-Demo interaktiv in der Konsole.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.swfdtf.demo.Main'
    standardInput = System.in
    args '--interactive', '--project', file('project').absolutePath
}

tasks.register('lintDemo', JavaExec) {
    group = 'demo'
    description = 'Prüft das Schneewittchen-.vjava-Projekt mit VJavaLinter.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.swfdtf.demo.Main'
    args '--lint', '--project', file('project').absolutePath
}

tasks.register('runDemoStudio', JavaExec) {
    group = 'demo'
    description = 'Startet KAGAYAKI im Dual-Window-Studio-Modus mit dem Schneewittchen-Projekt.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.swfdtf.demo.Main'
    args '--studio', '--project', file('project').absolutePath
    if (isMac) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.register('runDemoStandalone', JavaExec) {
    group = 'demo'
    description = 'Startet KAGAYAKI im Standalone-Fenster mit dem Schneewittchen-Projekt.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.swfdtf.demo.Main'
    args '--standalone', '--project', file('project').absolutePath
    if (isMac) {
        jvmArgs '-XstartOnFirstThread'
    }
}
