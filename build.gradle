plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
}

group = 'de.swfdtf'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def lwjglVersion = '3.3.6'
def osName = System.getProperty('os.name').toLowerCase()
def osArch = System.getProperty('os.arch').toLowerCase()
def isMac = osName.contains('mac') || osName.contains('darwin')
def isArm64 = osArch.contains('aarch64') || osArch.contains('arm64')

def lwjglNatives
if (osName.contains('win')) {
    lwjglNatives = isArm64 ? 'natives-windows-arm64' : 'natives-windows'
} else if (isMac) {
    lwjglNatives = isArm64 ? 'natives-macos-arm64' : 'natives-macos'
} else {
    lwjglNatives = isArm64 ? 'natives-linux-arm64' : 'natives-linux'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-stb'

    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"

    implementation 'org.joml:joml:1.10.8'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    e2eTest {
        java {
            srcDirs = ['src/e2eTest/java']
        }
        resources {
            srcDirs = ['src/e2eTest/resources']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

application {
    mainClass = 'de.swfdtf.Main'
    if (isMac) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

checkstyle {
    toolVersion = '10.24.0'
    configDirectory = file('gradle/checkstyle')
    configFile = file('gradle/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxErrors = 0
    maxWarnings = 0
    sourceSets = [sourceSets.main, sourceSets.test]
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('e2eTest', Test) {
    group = 'verification'
    description = 'Runs isolated opaque-box end-to-end tests from src/e2eTest/java.'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('runStudio', JavaExec) {
    group = 'kagayaki'
    description = 'Starts KAGAYAKI in Dual-Window Studio development mode.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.swfdtf.Main'
    def studioArgs = ['--studio']
    if (project.hasProperty('kagayakiProject')) {
        studioArgs.addAll(['--project', project.property('kagayakiProject').toString()])
    }
    args studioArgs
    if (isMac) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.register('runStandalone', JavaExec) {
    group = 'kagayaki'
    description = 'Starts KAGAYAKI in Standalone Game mode (Window B only).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.swfdtf.StandaloneMain'
    if (project.hasProperty('kagayakiProject')) {
        args '--standalone', project.property('kagayakiProject').toString()
    }
    if (isMac) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.register('packageStandalone', Jar) {
    group = 'kagayaki'
    description = 'Builds an executable standalone game JAR excluding Studio tools.'
    archiveBaseName = 'kagayaki-standalone'
    destinationDirectory = layout.buildDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': 'de.swfdtf.StandaloneMain',
            'Implementation-Title': 'KAGAYAKI Standalone Runtime',
            'Implementation-Version': project.version
        )
    }

    from(sourceSets.main.output) {
        exclude 'de/swfdtf/tools/StudioWindowController*'
        exclude '**/AGENT_CONTEXT.md'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}
